name: Build Tractor Turbo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack and build
        run: |
          unzip -o tractor_turbo_android_project.zip
          cd tractor_turbo_android_project
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare signing key
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/tractor-release.jks"
          test -s "$RUNNER_TEMP/tractor-release.jks"

      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="tractor_turbo_android_project/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/tractor-aligned.apk"
          SIGNED="tractor_turbo_android_project/android/app/build/outputs/apk/release/app-release-signed.apk"

          test -f "$UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/tractor-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"

          "$BT/apksigner" verify --verbose "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tractor-turbo-release-apk
          path: tractor_turbo_android_project/android/app/build/outputs/apk/release/app-release-signed.apk
